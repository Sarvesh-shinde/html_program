<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .container{
            display: flex;
            flex-direction:row;
            flex-wrap:wrap;

            

        }

        .child{
            width: 200px;
            height: 200px;
        }
        #c1{
            color: aqua;
        }

        #c2{
            color: blue;
        }

        #c3{
            color: darkgreen;
        }

        #c4{
            color: coral;
        }

    </style>
</head>
<body>
    <div class="container">
        <div id="c1" class="child">Monday</div>
        <div id="c2" class="child">Tuesday</div>
        <div id="c3" class="child">Wednesday</div>
        <div id="c4" class="child">Thursday</div>
        
    </div>
</body>
</html>
